# This is a Databricks asset bundle definition for sdp_northwind.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sdp_northwind
  uuid: b80275e6-4e18-41c2-ba53-e4d8052e730b

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-f652df78-dc6c.cloud.databricks.com
    variables:
      catalog: dev
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-f652df78-dc6c.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/rulyan.fernandes@indicium.tech to make sure we only have a single copy.
      root_path: /Workspace/Users/rulyan.fernandes@indicium.tech/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev
      schema: prod
    permissions:
      - user_name: rulyan.fernandes@indicium.tech
        level: CAN_MANAGE
