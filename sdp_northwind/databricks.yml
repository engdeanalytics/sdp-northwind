# This is a Databricks asset bundle definition for sdp_northwind.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: sdp_northwind
  uuid: b80275e6-4e18-41c2-ba53-e4d8052e730b

include:
  - resources/*.yml

sync:
  exclude:
    - src/models/**/.gitkeep
    - src/scripts/**/.gitkeep

permissions:
  - user_name: ${workspace.current_user.userName}
    level: CAN_MANAGE
    
# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  # Raw catalog and schemas
  raw_catalog:
    description: The source/raw catalog to read from.
    default: raw
  erp_source_schema:
    description: Raw catalog schema for the ERP Northwind source system.
    default: erp_northwind
  # Target catalog and schemas
  target_catalog:
    description: The catalog where pipeline outputs are published.
  target_schema:
    description: The active target schema for this run.
  # Production schemas
  staging_schema:
    description: Schema where staging datasets are published.
  intermediate_schema:
    description: Schema where intermediate datasets are published.
  marts_schema:
    description: Schema where marts datasets are published.


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-f652df78-dc6c.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      target_catalog: dev
      staging_schema: ${var.target_schema}
      intermediate_schema: ${var.target_schema}
      marts_schema: ${var.target_schema}

  prod:
    mode: production
    workspace:
      host: https://dbc-f652df78-dc6c.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      target_catalog: prod
      target_schema: prod # Default target schema for production, when schema is not specified
      staging_schema: staging
      intermediate_schema: intermediate
      marts_schema: marts

