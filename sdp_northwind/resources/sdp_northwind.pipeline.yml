# The main pipeline for sdp_northwind

resources:
  pipelines:
    sdp_northwind:
      name: sdp_northwind
      catalog: ${var.target_catalog}
      schema: ${var.target_schema}
      serverless: true
      root_path: ../src/models

      libraries:
        - glob:
            include: ../src/models/**/*.sql

      configuration:
        # Raw catalog and schemas
        raw_catalog: ${var.raw_catalog}
        erp_source_schema: ${var.erp_source_schema}
        # Target catalog and schemas
        target_catalog: ${var.target_catalog}
        target_schema: ${var.target_schema}
        # Production schemas
        staging_schema: ${var.staging_schema}
        intermediate_schema: ${var.intermediate_schema}
        marts_schema: ${var.marts_schema}
